name: Build for Hostinger

# Compila el sitio Astro y publica SOLO el resultado (dist/) en una rama
# dedicada. Hostinger (hPanel → Avanzado → Git) clona esa rama en public_html.
#   push a main  → rama deploy-main
#   push a test  → rama deploy-test

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npx --no-install astro build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Publish dist/ to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy-${{ github.ref_name }}
          force_orphan: true
          enable_jekyll: true
          commit_message: "deploy: ${{ github.sha }}"
